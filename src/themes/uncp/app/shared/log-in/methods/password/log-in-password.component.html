<form class="form-login uncp-auth-form"
      (ngSubmit)="submit()"
      [formGroup]="form" novalidate>
  <label class="uncp-auth-label" for="uncp-login-email">{{ 'login.form.email' | translate }}</label>
  <input id="uncp-login-email"
         autocomplete="username"
         autofocus
         class="form-control"
         formControlName="email"
         required
         type="email"
         [attr.data-test]="'email' | dsBrowserOnly">
  <label class="uncp-auth-label" for="uncp-login-password">{{ 'login.form.password' | translate }}</label>
  <input id="uncp-login-password"
         autocomplete="current-password"
         class="form-control"
         formControlName="password"
         required
         type="password"
         [attr.data-test]="'password' | dsBrowserOnly">
  <div *ngIf="(error | async) && hasError" class="alert alert-danger" role="alert"
       @fadeOut>{{ (error | async) | translate }}</div>
  <div *ngIf="(message | async) && hasMessage" class="alert alert-info" role="alert"
       @fadeOut>{{ (message | async) | translate }}</div>

  <button class="btn btn-primary btn-block uncp-auth-submit" type="submit" [attr.data-test]="'login-button' | dsBrowserOnly"
          [dsBtnDisabled]="!form.valid" role="button" tabindex="0"><i class="fas fa-sign-in-alt"></i> {{"login.form.submit" | translate}}</button>
</form>

<div class="uncp-auth-links">
  <a *ngIf="canRegister$ | async" [routerLink]="[getRegisterRoute()]" [attr.data-test]="'register' | dsBrowserOnly" tabindex="0">
    {{ 'login.form.new-user' | translate }}
  </a>
  <a [routerLink]="[getForgotRoute()]" [attr.data-test]="'forgot' | dsBrowserOnly" tabindex="0">
    {{ 'login.form.forgot-password' | translate }}
  </a>
</div>
