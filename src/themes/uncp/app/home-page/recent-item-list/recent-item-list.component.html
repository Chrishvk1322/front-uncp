<ng-container *ngVar="(itemRD$ | async) as itemRD">
        <div class="mt-2 float-left w-100" [ngClass]="placeholderFontClass" *ngIf="itemRD?.hasSucceeded && itemRD?.payload?.page.length > 0" @fadeIn>
                <h3> {{'home.recent-submissions.head' | translate}}</h3>
                <div class="d-flex flex-row mb-4 pb-2"></div>
                <div class="my-4" *ngFor="let item of itemRD?.payload?.page">
                  <ds-listable-object-component-loader [object]="item" [viewMode]="viewMode" class="pb-4">
                  </ds-listable-object-component-loader>
                </div>
                <button (click)="onLoadMore()" class="btn btn-success bg-success search-button mb-4 float-right" role="link" tabindex="0">
                  {{'vocabulary-treeview.load-more' | translate }} ...
                </button>
        </div>
        <ds-error *ngIf="itemRD?.hasFailed" message="{{'error.recent-submissions' | translate}}"></ds-error>
        <ds-loading *ngIf="!itemRD || itemRD.isLoading" message="{{'loading.recent-submissions' | translate}}">
        </ds-loading>
</ng-container>
