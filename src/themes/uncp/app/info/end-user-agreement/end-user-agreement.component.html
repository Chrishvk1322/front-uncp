<div class="container uncp-info">
  <ds-end-user-agreement-content></ds-end-user-agreement-content>

  <form class="form-user-agreement-accept uncp-info-accept" (ngSubmit)="submit()" novalidate>
    <div class="custom-control custom-checkbox">
      <input class="custom-control-input" type="checkbox" id="user-agreement-accept" [(ngModel)]="accepted" [ngModelOptions]="{standalone: true}">
      <label class="custom-control-label" for="user-agreement-accept">{{ 'info.end-user-agreement.accept' | translate }}</label>
    </div>

    <div class="d-flex mt-3">
      <button id="button-cancel" type="button" (click)="cancel()" class="btn btn-outline-primary mr-auto">{{ 'info.end-user-agreement.buttons.cancel' | translate }}</button>
      <button id="button-save" type="submit" class="btn uncp-auth-submit uncp-info-submit" [dsBtnDisabled]="!accepted">{{ 'info.end-user-agreement.buttons.save' | translate }}</button>
    </div>
  </form>
</div>
